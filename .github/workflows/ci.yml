name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.13", "3.14"]
        include:
          # The files this tool reads come from Excel on Windows: one job runs where they are made.
          - os: windows-latest
            python-version: "3.13"

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Types
        run: mypy src tests scripts

      - name: Tests
        run: pytest

      - name: The command, as a person runs it on the examples
        shell: bash
        run: |
          table-audit --version
          code=0
          table-audit profile examples/participants.csv --key subject_id,visit || code=$?
          test "$code" -eq 1   # the examples are dirty on purpose: exit code 1 is the right answer
          code=0
          table-audit leakage examples/train.csv examples/test.csv --group subject_id --target qc --time date || code=$?
          test "$code" -eq 1
